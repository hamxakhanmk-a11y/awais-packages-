  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  <link rel="icon" type="image/svg+xml" href="/awais-favicon.svg" />
  
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/awais-home.css" />

  <script>
    try {
      const pending = JSON.parse(sessionStorage.getItem('site-tab-navigation') || 'null');
      sessionStorage.removeItem('site-tab-navigation');
      if (pending && pending.path === location.pathname && Date.now() - pending.time < 15000) {
        document.documentElement.classList.add('tab-navigation');
      }
    } catch {}
  </script>
